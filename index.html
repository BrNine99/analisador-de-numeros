<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Numeros</title>
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
        <p>Analise uma sequência de números e gere um pequeno relatório estatístico.</p>
    </header>

    <main>
        <section id="adiciona-numeros">

            <input type="number" name="numero" id="numero" placeholder="Digite um número inteiro">
            <button type="button" id="adicionar" onclick="adicionar()">Adicionar</button>

        </section>

        <section id="numeros-adicionados">
            <p>Numeros adicionados</p>
            <p id="lista"></p>

            <button type="button" id="analisador">Analisar números</button>
            <button type="button" id="limpar">Limpar lista</button>

        </section>

        <section id="analise">
            <p id="quantidade">Quantidade:</p>
            <p id="soma">Soma:</p>
            <p id="media">Média:</p>
            <p id="maior">Maior número:</p>
            <p id="menor">Menor numero:</p>
            <p id="pares">Números pares:</p>
            <p id="impares">Números ímpares:</p>

        </section>

    </main>

    <script src="script.js"></script>
    
</body>
</html>
